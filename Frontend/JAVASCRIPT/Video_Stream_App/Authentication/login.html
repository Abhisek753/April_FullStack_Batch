<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./login.css">
</head>
<body>
    <div class="login-container">
        <h1>Login</h1>
        <form id="register-form">
          
             <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Enter you email" required >
            </div>
             <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Enter you password" required >
            </div>
            <button  type="submin">Login</button>
        </form>
        <p>Don't have an account register here? <a href="./register.html">Register Here</a></p>
    </div>
    <script src="./login.js"></script>
</body>
</html>
